name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (lint rules, API prefix, MU118)
        run: python -m unittest discover -s scripts/tests -v
      - name: Lint the shipped skills (warnings fail the build)
        run: python scripts/mobile_ui_lint.py skills/ --strict
